[general]
# 450 Hz biquad notch on RX while dialling (China dial tone).
dialtone_notch = 450
# OSLEC line echo cancellation in an7581-pcm.  The channel driver applies
# this to the module parameter when it loads.
echo_cancellation = 1
pcm_dev = /dev/an7581-pcm
slic_dev = /dev/an7581-slic
context = from-analog
exten = s
line_name = line1
