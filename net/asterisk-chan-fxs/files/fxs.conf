[general]
# 450 Hz biquad notch on RX while dialling (China dial tone).
dialtone_notch = 450
# OSLEC line echo cancellation is applied through the generic fxs-core
# control device when the channel driver loads.
echo_cancellation = 1
line = 0
ctl_dev = /dev/fxs0
pcm_dev = /dev/fxs0-pcm
context = from-analog
exten = s
line_name = line1
